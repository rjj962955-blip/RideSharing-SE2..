<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Ride - CampusRide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="logo">CampusRide.</div>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="create-ride.html">Create Ride</a>
            <a href="find-ride.html">Find Ride</a>
            <a href="profile.html">Profile</a>
            <a href="login.html">Log Out</a>
        </div>
    </div>

    <!-- Page Content -->
    <div class="page-container">
        <h1 class="page-title">Quick Ride Search</h1>

        <div class="form-group">
            <label>Pickup Location</label>
            <input type="text" placeholder="Building 324, Gate 8 - Imam University">
        </div>

        <div class="form-group">
            <label>Drop-off Location</label>
            <input type="text" placeholder="King Fahd National Library">
        </div>

        <div class="form-group">
            <label>Date & Time</label>
            <input type="datetime-local">
        </div>

        <div class="form-group">
            <label>Seats Needed</label>
            <input type="number" min="1" max="4" value="1">
        </div>

        <div class="form-group">
            <label>Gender Preference</label>
            <select>
                <option>Any</option>
                <option>Female Only</option>
                <option>Male Only</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ride Type</label>
            <select>
                <option>One-way</option>
                <option>Round Trip</option>
            </select>
        </div>

        <button class="btn-primary" style="width:100%; margin-top:15px;">Search Ride</button>
    </div>

</body>
</html>
