<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusRide - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDE (FORM) */
        .left {
            width: 50%;
            background: #ffffff;
            padding: 60px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #4b3fbf;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            background-color: #150f8f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: #111699;
        }

        #error {
            margin-top: 12px;
            font-size: 14px;
            color: red;
        }

        /* RIGHT SIDE (WELCOME) */
        .right {
            width: 50%;
            background-color: #2f2a85;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px;
            text-align: center;
        }

        .right h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .right p {
            font-size: 18px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <div class="logo">CampusRide</div>

        <h2>Log in</h2>

        <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" placeholder="example@imamu.edu.sa">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="password" type="password" placeholder="Enter your password">
        </div>

        <button class="btn" onclick="validateLogin()">Log in</button>

        <p id="error"></p>

        <p style="margin-top: 15px; font-size: 14px;">
            or <a href="signup.html" style="color:#4b3fbf; text-decoration:none;">Sign up</a>
        </p>

        <p style="margin-top: 8px; font-size: 13px;">
            <a href="#" style="color:#4b3fbf; text-decoration:none;">Forgot Password?</a>
        </p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <h1>Welcome back!</h1>
        <p>Your campus ride starts here.</p>
    </div>

</div>

<script>
    function validateLogin() {
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value.trim();
        let error = document.getElementById("error");

        // إذا الإيميل فاضي
        if (email === "") {
            error.textContent = "❌ الرجاء كتابة الإيميل الجامعي";
            return;
        }

        // إذا الباسورد فاضي
        if (password === "") {
            error.textContent = "❌ الرجاء كتابة كلمة المرور";
            return;
        }

        // التحقق من الإيميل الجامعي
        if (!email.endsWith("@imamu.edu.sa")) {
            error.textContent = "❌ يجب استخدام الإيميل الجامعي (@imamu.edu.sa)";
            return;
        }

        // التحقق من كلمة المرور
        if (password.length < 6) {
            error.textContent = "❌ كلمة المرور يجب أن تكون 6 أرقام أو أكثر";
            return;
        }

        // نجاح
        error.style.color = "green";
        error.textContent = "✔ تسجيل الدخول ناجح!";

        // الانتقال للصفحة الرئيسية
        setTimeout(() => {
            window.location.href = "index.html";
        }, 800);
    }
</script>

</body>
</html>
